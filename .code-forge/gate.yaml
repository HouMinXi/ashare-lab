backends:
  review-route:
    type: api
    format: openai
    base_url: https://192.168.100.10:20128/v1
    api_key_env: OMNIROUTE_API_KEY
    model: review-route                # combo: DS-V4-Flash → DS-V4-Pro
    stream: true                       # MANDATORY: OmniRoute always returns SSE
    thinking_type: "enabled"
    reasoning_effort: "high"
    max_completion_tokens: 32768
    timeout_s: 600
    default: true
  omniroute-dspro:
    type: api
    format: openai
    base_url: https://192.168.100.10:20128/v1
    api_key_env: OMNIROUTE_API_KEY
    model: volcengine-std/ep-20260710014557-mhv5q  # DS-V4-Pro, pin
    stream: true
    thinking_type: "enabled"
    reasoning_effort: "high"
    max_completion_tokens: 32768
    timeout_s: 600
  deepseek-direct:
    type: api
    format: openai
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-flash
    thinking_type: "enabled"
    reasoning_effort: "high"
    max_completion_tokens: 32768
    timeout_s: 600

test:
  command: [pytest, -q, --timeout=60]
  timeout_seconds: 900
