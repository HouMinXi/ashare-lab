[project]
name = "ashare-lab"
version = "0.1.0"
description = "A-share daily-frequency paper-trading lab (Qlib + LightGBM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqlib==0.9.7",
    "numpy<2.0",
    "lightgbm",
    "pandas",
    "pyyaml",
    "requests",
    "tushare",
    "baostock",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pylint",
]
