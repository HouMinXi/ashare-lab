[project]
name = "ashare-lab"
version = "0.1.0"
description = "A-share daily-frequency paper-trading lab (Qlib + LightGBM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqlib==0.9.7",
    "numpy<2.0",
    "lightgbm",
    "pandas",
    "pyyaml",
    "requests",
    "tushare",
    "baostock",
    "exchange-calendars>=4.13.2",
    "easy-tdx>=1.11.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
ashare-baseline = "ashare_lab.research.report:main"

[tool.setuptools.packages.find]
include = ["ashare_lab*"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pylint",
]
