[project]
name = "ashare-lab"
version = "0.1.0"
description = "A-share daily-frequency paper-trading lab (Qlib + LightGBM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqlib==0.9.7",
    "numpy<2.0",
    "lightgbm",
    "pandas",
    "pyyaml",
    "requests",
    "akshare",
    "tushare",
    "baostock",
    "exchange-calendars>=4.13.2",
    "easy-tdx>=1.11.1",
    "wakeonlan",
    "netifaces",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
ashare-baseline = "ashare_lab.research.report:main"
ashare-attribution = "ashare_lab.research.attribution:main"

[tool.setuptools.packages.find]
include = ["ashare_lab*"]

[tool.ruff]
# The code holds 120; the old 100 was never enforced because E501 was not
# selected, so every line between the two was silently over the stated limit.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# The gate covers what the tree is already clean at: real errors, undefined
# names, whitespace, stale `# noqa` comments, and the column limit. Import order
# (I) is left out on purpose -- it would rewrite nearly every file in one blind
# commit, and it is churn rather than correctness. Apply it to a file when that
# file is being edited anyway.
select = ["E4", "E7", "E9", "F", "W", "RUF100", "E501"]

[tool.ruff.lint.per-file-ignores]
# These set environment or sys.path before importing the package, which is the
# point of the late import, not an oversight.
"ashare_lab/cli.py" = ["E402"]
"ashare_lab/data/validator.py" = ["E402"]
"ashare_lab/paper/backup_job.py" = ["E402"]
"ashare_lab/research/analyze_matrix.py" = ["E402"]
"scripts/fill_industry.py" = ["E402"]
# QMT strategy scripts only import after the client hands them a context.
"scripts/qmt/test_qmt_connect.py" = ["E402"]
"scripts/qmt/test_userdata_connect.py" = ["E402"]

[tool.pytest.ini_options]
# The sentiment smoke tests reach the network and the LLM, so they stay
# out of the default run; select them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: requires qlib runtime with real price data",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout>=2.1",
    "pytest-asyncio",
    "ruff",
    "pylint",
]
