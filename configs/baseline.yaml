---
universe:
  primary: csi1000      # try: more alpha in smaller/mid caps than csi500
  reference: csi500
  exclude_close_above_cny: 300
walk_forward:
  train_start: "2018-01-01"    # absolute earliest allowed train start (safety floor)
  base_train_end: "2022-12-31"
  step_months: 6
  min_windows: 5
  train_window_years: 3        # rolling window; null = expanding (original behavior)
model:
  type: tra                 # R10: TRA (Temporal Routing Adaptor, KDD 2021)
  handler: alpha360         # TRA uses raw price/volume features (360-dim)
  step_len: 60              # MTSDatasetH lookback window (trading days; paper default)

  # TRA backbone: GRU with concat-attention (same architecture as paper)
  backbone:
    input_size: 360         # must match Alpha360 feature count
    hidden_size: 64         # paper default
    num_layers: 2
    rnn_arch: GRU
    use_attn: true          # concat-attention as in Adv-ALSTM
    dropout: 0.0

  # TRA routing head: 3 market-regime patterns, LR+TPE routing signal
  routing:
    num_states: 3           # paper default; 3 regimes for CSI markets
    hidden_size: 16         # router GRU hidden size
    tau: 1.0                # gumbel-softmax temperature
    src_info: LR_TPE        # Latent Repr + Transport Prediction Error (paper best)
    rnn_arch: GRU
    num_layers: 1
    dropout: 0.0

  # TRAModel training
  transport_method: router  # full TRA with optimal transport routing
  pretrain: true            # pretrain backbone first, then finetune TRA head
  n_epochs: 200             # reduced from paper 500 for 6-window feasibility
  early_stop: 30            # patience on valid IC
  lr: 0.001

  # LGB reference params (kept for documentation; not used when type=tra)
  learning_rate: 0.0421
  colsample_bytree: 0.8879
  subsample: 0.8789
  lambda_l1: 205.6999
  lambda_l2: 580.9768
  max_depth: 8
  num_leaves: 210
  num_boost_round: 500
  device: gpu
strategy:
  # CSI1000: IC high, try n_drop=3 to capture signal faster before decay
  topk: 15
  main:
    n_drop: 3
  control:
    n_drop: 5
cost_model:
  account: 300000
  trade_unit: 100
  # documentation-only; NOT passed to strategy ctor (see binding table)
  risk_degree: 0.95
  benchmark: "SH000852"    # CSI1000 index -- matches universe (was incorrectly SH000300=CSI300)
  deal_price: close
  open_cost: 0.00026
  close_cost: 0.00076
  min_cost: 5
  slippage: 0.001
  limit_threshold: 0.099
gate:
  min_mean_rank_ic: 0.02
  min_positive_excess_pct: 0.60
  border_pass_ic_upper: 0.022
  border_pass_excess_upper: 0.66
# extra levels above cost_model.slippage baseline
slippage_sensitivity: [0.0015, 0.002]
slippage_fragility:
  # fragile if excess drops > 50% vs baseline at any level
  rel_drop_threshold: 0.50
  # treat abs(excess) <= this as flat (no float-noise sign flip)
  abs_tol: 0.0005
