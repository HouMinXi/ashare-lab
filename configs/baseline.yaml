---
universe:
  primary: csi1000      # try: more alpha in smaller/mid caps than csi500
  reference: csi500
  exclude_close_above_cny: 300
walk_forward:
  train_start: "2018-01-01"    # absolute earliest allowed train start (safety floor)
  base_train_end: "2020-12-31"
  step_months: 6
  min_windows: 5
  train_window_years: 3        # rolling window; null = expanding (original behavior)
model:
  type: tra                 # R10: TRA (Temporal Routing Adaptor, KDD 2021)
  handler: alpha158         # Alpha360 triggers qlib 0.9.7 multiprocessing bug on Windows;
                            # Alpha158 loads correctly (same as R9 LGB baseline)
  step_len: 20              # Alpha158 natural lookback; shorter than Alpha360's 60

  # TRA backbone: GRU with concat-attention
  backbone:
    input_size: 158         # must match Alpha158 feature count (was 360 for Alpha360)
    hidden_size: 64         # paper default
    num_layers: 2
    rnn_arch: GRU
    use_attn: true          # concat-attention as in Adv-ALSTM
    dropout: 0.0

  # TRA routing head: 3 market-regime patterns, LR+TPE routing signal
  routing:
    num_states: 3           # paper default; 3 regimes for CSI markets
    hidden_size: 16         # router GRU hidden size
    tau: 1.0                # gumbel-softmax temperature
    src_info: LR_TPE        # Latent Repr + Transport Prediction Error (paper best)
    rnn_arch: GRU
    num_layers: 1
    dropout: 0.0

  # TRAModel training
  transport_method: router  # full TRA with optimal transport routing
  pretrain: true            # pretrain backbone first, then finetune TRA head
  n_epochs: 200             # reduced from paper 500 for 6-window feasibility
  early_stop: 30            # patience on valid IC
  lr: 0.001

  # LGB reference params (kept for documentation; not used when type=tra)
  learning_rate: 0.0421
  colsample_bytree: 0.8879
  subsample: 0.8789
  lambda_l1: 205.6999
  lambda_l2: 580.9768
  max_depth: 8
  num_leaves: 210
  num_boost_round: 500
  device: gpu
strategy:
  # R12: n_drop=1 to reduce turnover cost -- TRA IC=0.040 is strong but
  # n_drop=3 burned W4 (+2.5% vs LGB's +19.9% on same signal strength 0.058)
  topk: 15
  main:
    n_drop: 1
  control:
    n_drop: 5
cost_model:
  account: 300000
  trade_unit: 100
  # documentation-only; NOT passed to strategy ctor (see binding table)
  risk_degree: 0.95
  benchmark: "SH000852"    # CSI1000 index -- matches universe (was incorrectly SH000300=CSI300)
  deal_price: close
  open_cost: 0.00026
  close_cost: 0.00076
  min_cost: 5
  slippage: 0.001
  limit_threshold: 0.099
gate:
  min_mean_rank_ic: 0.02
  min_positive_excess_pct: 0.60
  border_pass_ic_upper: 0.022
  border_pass_excess_upper: 0.66
# extra levels above cost_model.slippage baseline
slippage_sensitivity: [0.0015, 0.002]
slippage_fragility:
  # fragile if excess drops > 50% vs baseline at any level
  rel_drop_threshold: 0.50
  # treat abs(excess) <= this as flat (no float-noise sign flip)
  abs_tol: 0.0005
paper:
  db_path: "paper.db"
  carry_days: 3
  volume_participation_pct: 0.05
  topk: 15
  n_drop: 1
  initial_cash: 300000
  backup_retention_days: 7
  slippage: 0.001
  listing_min_days: 60
  liquidity_min_turnover: 50000000
  predictions_dir: "predictions"
  min_signal_coverage: 100
  risk:
    drawdown_hard: 0.15
    daily_loss: 0.03
    concentration: 0.15
    market_regime_decline: 0.08
    market_regime_days: 10
    trailing_stop: 0.20
    trailing_cooldown_days: 10
    industry_cap: 0.30
    soft_drawdown: 0.10
    soft_drawdown_recovery: 0.95
    default_topk: 15
    reduced_topk: 7
  sentiment:
    enabled: true
    stock_threshold: -2
    industry_threshold: -2
    global_threshold: -3
    news_count: 10
    rate_limit_base: 1.0
    rate_limit_jitter: 0.5
    deepseek_model: "deepseek-v4-flash"
    deepseek_timeout: 30
  report:
    deepseek_model: "deepseek-v4-flash"
    deepseek_timeout: 30
    ilink_timeout: 15
    ilink_max_message_length: 4000
    ilink_chunk_delay: 0.3
    fallback_service: "serverchan"
    fallback_timeout: 15
    detailed_triggers:
      daily_loss_pct: 0.02
      min_trade_count: 5
