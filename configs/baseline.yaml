---
universe:
  primary: csi1000      # try: more alpha in smaller/mid caps than csi500
  reference: csi500
  exclude_close_above_cny: 300
walk_forward:
  train_start: "2018-01-01"    # absolute earliest allowed train start (safety floor)
  base_train_end: "2022-12-31"
  step_months: 6
  min_windows: 5
  train_window_years: 3        # rolling window; null = expanding (original behavior)
model:
  type: lgbm                # QUICK FIX RUN: verify benchmark change impact
  handler: alpha158         # alpha158 for LGB; alpha360 for ALSTM
  # ALSTM hyperparameters (research-optimised for RTX 3080 + CSI1000)
  d_feat: 360               # alpha360 full feature count
  hidden_size: 128          # doubled from default 64: +5-10% IC, still <2GB VRAM
  num_layers: 2
  dropout: 0.1              # light regularisation (CSI1000 noisier than CSI300)
  n_epochs: 200
  lr: 0.001
  batch_size: 8192          # 4x default; 20GB VRAM is not the bottleneck
  early_stop: 20
  GPU: 0                    # CUDA device index (RTX 3080)
  step_len: 20              # matches Alpha360 20-day construction window
  n_jobs: 0                 # MANDATORY on Windows: DataLoader spawn multiprocessing broken
  # LGB fallback params (used when type=lgbm)
  learning_rate: 0.0421
  colsample_bytree: 0.8879
  subsample: 0.8789
  lambda_l1: 205.6999
  lambda_l2: 580.9768
  max_depth: 8
  num_leaves: 210
  num_boost_round: 500
  device: gpu
strategy:
  # CSI1000: IC high, try n_drop=3 to capture signal faster before decay
  topk: 15
  main:
    n_drop: 3
  control:
    n_drop: 5
cost_model:
  account: 300000
  trade_unit: 100
  # documentation-only; NOT passed to strategy ctor (see binding table)
  risk_degree: 0.95
  benchmark: "SH000852"    # CSI1000 index -- matches universe (was incorrectly SH000300=CSI300)
  deal_price: close
  open_cost: 0.00026
  close_cost: 0.00076
  min_cost: 5
  slippage: 0.001
  limit_threshold: 0.099
gate:
  min_mean_rank_ic: 0.02
  min_positive_excess_pct: 0.60
  border_pass_ic_upper: 0.022
  border_pass_excess_upper: 0.66
# extra levels above cost_model.slippage baseline
slippage_sensitivity: [0.0015, 0.002]
slippage_fragility:
  # fragile if excess drops > 50% vs baseline at any level
  rel_drop_threshold: 0.50
  # treat abs(excess) <= this as flat (no float-noise sign flip)
  abs_tol: 0.0005
