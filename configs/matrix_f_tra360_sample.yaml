---
# Candidate F: TRA sample-mode, Alpha360
# MODEL VARIANT -- batch_size>0 uses transport_sample (different Sinkhorn scope
# than daily mode). This is a separate candidate, not a speedup of C.
model:
  type: tra
  tag: f_tra360_sample
  handler: alpha360
  step_len: 60
  batch_size: 512
  use_amp: true
  backbone:
    input_size: 6
    hidden_size: 64
    num_layers: 2
    rnn_arch: GRU
    use_attn: true
    dropout: 0.0
  routing:
    num_states: 3
    hidden_size: 32
    tau: 1.0
    src_info: LR_TPE
    rnn_arch: GRU
    num_layers: 1
    dropout: 0.0
  transport_method: router
  pretrain: true
  n_epochs: 200
  early_stop: 30
  lr: 0.001
matrix:
  tag: f_tra360_sample
  seeds: [42, 123, 456]
